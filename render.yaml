# Render Blueprint for a public FigoAI web service.
# Create a Blueprint in Render and connect this repository. Add the secret
# values marked sync:false in the Render service Environment screen.
services:
  - type: web
    name: figoai
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_GENERAL_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_CODING_MODEL
        value: anthropic/claude-sonnet-4
      - key: OPENROUTER_TITLE_MODEL
        value: google/gemini-2.5-flash
      - key: GROQ_VOICE_API_KEY
        sync: false
      - key: GROQ_TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: GROQ_TTS_VOICE
        value: troy
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: GUEST_JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_USERNAME
        value: figobiziman
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
